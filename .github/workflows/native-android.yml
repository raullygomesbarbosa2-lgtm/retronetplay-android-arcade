name: Build RetroNetPlay Android native (no WebView)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Unpack original app and native port source
        run: |
          mkdir appsrc
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('project-source.zip') as z: z.extractall('appsrc')
          PY
          test -f appsrc/native-android/app/src/main/java/com/bytevortex/retronetplay/nativeapp/MainActivity.kt
          mkdir -p appsrc/native-android/app/src/main/assets
          cp appsrc/firebase-applet-config.json appsrc/native-android/app/src/main/assets/firebase-applet-config.json
      - name: Build native app and verify package has no WebView
        working-directory: appsrc/native-android
        run: |
          set +e
          gradle --no-daemon assembleDebug > /tmp/native-gradle.log 2>&1
          result=$?
          tail -n 100 /tmp/native-gradle.log
          if [ $result -ne 0 ]; then
            grep -E '(^e: | error:|FAILURE:|What went wrong:|Could not resolve|Unresolved reference|No value passed)' /tmp/native-gradle.log | tail -n 20 | tr '\n' ' ' > /tmp/native-errors.txt || true
            echo "::error title=Native Android build details::$(cat /tmp/native-errors.txt)"
            exit $result
          fi
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          mkdir -p app/build/outputs/apk/debug/unpack
          cd app/build/outputs/apk/debug/unpack
          unzip -q ../app-debug.apk
          if grep -R -a -q 'com.getcapacitor.BridgeActivity' .; then echo 'Capacitor unexpectedly found in native APK'; exit 1; fi
          cd ../../../../../../
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: native-port-${{ github.run_number }}
          name: RetroNetPlay Native Port ${{ github.run_number }}
          body: |
            Android-native port of the original RetroNetPlay flows. No Capacitor or WebView.
            Android 6.0+ (minSdk 23); native login, room/ROM UI, REST/WebSocket connection, Android document picker, LibretroDroid frontend, touch/gamepad controls, dynamic native core catalog.
            This CI APK still requires real-device validation. Online gameplay frame streaming is not validated on Android 6 and must not be presented as tested.
            No ROM or BIOS files are included.
          files: |
            appsrc/native-android/app/build/outputs/apk/debug/app-debug.apk
            appsrc/native-android/app/build/outputs/apk/debug/SHA256SUMS.txt
